---
# Sandbox stand-in for the gitStream title rule of ms-ml-genai-agents-bs PR
# #562: the pull request title must follow "type(scope): description [ABC-123]".
# The scope and a single ticket are required; there is no NO-TICKET exception.
# Like #562, it checks only the title: single-commit pull requests are squashed
# with the commit subject, which is not checked.
name: PR Title

on:
  workflow_call:
    inputs:
      skip_actors:
        description: "Comma-separated pull request authors that are not checked."
        type: string
        required: false
        default: "dependabot[bot]"

jobs:
  pr_title:
    if: >-
      github.event_name == 'pull_request' &&
      !contains(format(',{0},', inputs.skip_actors), format(',{0},', github.event.pull_request.user.login))
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)\([a-z0-9][a-z0-9._/-]*\)!?:[[:space:]][^[:space:]].*[[:space:]]\[[A-Z][A-Z0-9]*-[0-9]+\]$'
          if [[ "$TITLE" =~ $pattern ]]; then
            echo "ok: $TITLE"
          else
            echo "::error title=Invalid pull request title::'${TITLE}' must match 'type(scope): description [ABC-123]'."
            exit 1
          fi
