---
name: Release Tooling

on:
  push:
    branches: [main]
    paths:
      - .github/scripts/release_version/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release_version_test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: shellcheck .github/scripts/release_version/*.sh
      - run: bash .github/scripts/release_version/install_git_cliff.sh
      - run: bash .github/scripts/release_version/release_version.test.sh
      - run: bash .github/scripts/release_version/release_notes.test.sh
