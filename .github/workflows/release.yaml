---
# Sandbox copy of the ms-ml-genai-agents-bs Release Flow (PR #536): the same
# job order with stub reusable workflows that only create tags and GitHub
# Releases. Nothing is deployed. Run it from main.
name: Release Flow

on:
  workflow_dispatch:
    inputs:
      releaseCandidateVersion:
        description: "Optional override (vX.Y.Z-rc.N). Leave empty to compute it."
        required: false
        default: ""
      simulate_failure:
        description: "Stage that should fail"
        type: choice
        default: none
        options: [none, stg_deploy, prd_deploy]

run-name: Release Flow on ${{ github.ref_name }}${{ inputs.releaseCandidateVersion && format(' at version {0}', inputs.releaseCandidateVersion) || '' }} (simulate_failure=${{ inputs.simulate_failure }})

permissions:
  contents: write

concurrency:
  group: release-flow
  cancel-in-progress: false

jobs:
  # Fails fast with a clear message instead of failing later in deploy_stg.
  check_branch:
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require main or a release branch
        env:
          REF: ${{ github.ref }}
        run: |
          case "$REF" in
            refs/heads/main | refs/heads/release/*)
              echo "Releasing from ${REF#refs/heads/}" ;;
            *)
              echo "::error title=Invalid release branch::Run the Release Flow from main or a release/** branch, not ${REF}."
              exit 1 ;;
          esac

  compute_version:
    needs: [check_branch]
    uses: ./.github/workflows/get_next_release_version.yaml
    with:
      version_override: ${{ inputs.releaseCandidateVersion }}
      release_notes_preview: true
      linear_workspace: hernanyupanqui

  validate_release:
    needs: [compute_version]
    uses: ./.github/workflows/stub_validate_release.yaml
    with:
      version: ${{ needs.compute_version.outputs.version }}

  deploy_stg:
    needs: [compute_version, validate_release]
    uses: ./.github/workflows/stub_deploy.yaml
    with:
      environment: stg
      version: ${{ needs.compute_version.outputs.version }}
      fail: ${{ inputs.simulate_failure == 'stg_deploy' }}

  get_last_tag:
    needs: [compute_version, deploy_stg]
    uses: ./.github/workflows/stub_last_tag.yaml
    with:
      tag: ${{ needs.compute_version.outputs.version }}

  generate_pre_release:
    needs: [compute_version, get_last_tag]
    uses: ./.github/workflows/stub_generate_release.yaml
    with:
      environment: stg
      releaseCandidateVersion: ${{ needs.compute_version.outputs.version }}

  promote_prd:
    needs: [generate_pre_release]
    uses: ./.github/workflows/stub_approve.yaml
    with:
      environment: promotePRD

  deploy_prd:
    needs: [compute_version, promote_prd]
    uses: ./.github/workflows/stub_deploy.yaml
    with:
      environment: prd
      version: ${{ needs.compute_version.outputs.version }}
      fail: ${{ inputs.simulate_failure == 'prd_deploy' }}

  generate_release:
    needs: [compute_version, deploy_prd]
    uses: ./.github/workflows/stub_generate_release.yaml
    with:
      environment: prd
      releaseCandidateVersion: ${{ needs.compute_version.outputs.version }}

  # Linear Releases: the release is named vX.Y.Z without -rc.N, so retried
  # candidates update the same release. Linear failures never block the deploy.
  linear_stg:
    needs: [deploy_stg, compute_version]
    uses: ./.github/workflows/linear_release.yaml
    with:
      command: sync
      version: ${{ needs.compute_version.outputs.version }}
      stage: stg
    secrets:
      LINEAR_ACCESS_KEY: ${{ secrets.LINEAR_ACCESS_KEY }}

  linear_prd:
    needs: [deploy_prd, compute_version]
    uses: ./.github/workflows/linear_release.yaml
    with:
      command: complete
      version: ${{ needs.compute_version.outputs.version }}
      linear_workspace: hernanyupanqui
    secrets:
      LINEAR_ACCESS_KEY: ${{ secrets.LINEAR_ACCESS_KEY }}
