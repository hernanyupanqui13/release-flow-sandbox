---
name: PR Title Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr_title:
    uses: ./.github/workflows/pr_title.yaml
    with:
      skip_actors: ${{ vars.PR_TITLE_SKIP_ACTORS || 'dependabot[bot]' }}
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}
